<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог спеціалістів громади Kitchener-Waterloo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav class="top-nav">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span data-i18n="nav_brand">Разом KW</span>
    </a>
    <a href="apply.html" class="nav-cta" data-i18n="cat_add_btn">Додати спеціаліста</a>
  </nav>
  


  <!-- Modal -->
  <div id="specialist-modal" class="modal" aria-hidden="true" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-name">
      <div class="modal-header">
        <h2 id="modal-name" class="modal-name">Name</h2>
        <button id="modal-close" class="modal-close" aria-label="Закрити">&times;</button>
      </div>
      <div class="modal-body">
        <p id="modal-subcategory" class="card-subcategory"></p>
        <p id="modal-location" class="card-location"></p>
        <div id="modal-description" class="card-description" style="margin-top: 1rem;"></div>
        <p id="modal-price" class="card-price" style="margin-top: 0.5rem;"></p>
        <div id="modal-contacts" class="card-contacts" style="margin-top: 1rem;"></div>
        <p id="modal-notes" class="card-notes" style="margin-top: 1rem;"></p>
        <p id="modal-dates" class="card-dates" style="margin-top: 1rem; font-size: 0.8rem; color: #6c757d;"></p>
        <div id="modal-feedback-wrap" style="margin-top: 1.5rem; text-align: center;">
          <a id="modal-feedback-link" class="card-feedback-link" style="font-size: 0.85rem; color: #dc3545; text-decoration: underline;">Повідомити про неточність</a>
        </div>
      </div>
    </div>
  </div>

  <main>
    <section class="controls" aria-label="Фільтри каталогу">
      <div class="search-row">
        <input
          type="search"
          id="search-input"
          class="search-input"
          placeholder="Пошук за іменем, описом або підкатегорією…"
          aria-label="Пошук"
          data-i18n="cat_search"
        />
        <select id="location-select" class="location-select" aria-label="Локація"></select>
      </div>

      <div id="category-pills" class="pills" role="group" aria-label="Головні категорії"></div>
      <div id="subcategory-chips" class="chips" role="group" aria-label="Підкатегорії"></div>
    </section>

    <p id="status" class="status" aria-live="polite"></p>

    <section id="cards-grid" class="cards-grid" aria-label="Спеціалісти"></section>
  </main>

  <footer class="site-footer">
    <p data-i18n="cat_footer">
      Дані каталогу оновлюються через громадську модерацію. Побачили помилку чи хочете додати
      спеціаліста? Зверніться до модераторів громади KW.
    </p>
  </footer>

  <script type="module" src="js/app.js"></script>
<script src="js/i18n.js?v=2"></script>
</body>
</html>
