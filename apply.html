<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подати заявку в Каталог спеціалістів громади KW</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/home.css" />
  <style>
    .form-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .btn-submit {
      background-color: #0056b3;
      color: #fff;
      border: none;
      padding: 1rem 1.5rem;
      border-radius: 4px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s;
    }
    .btn-submit:hover {
      background-color: #004494;
    }
    .btn-submit:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    .form-message {
      margin-top: 1rem;
      padding: 1rem;
      border-radius: 4px;
      display: none;
    }
    .form-message.success {
      display: block;
      background-color: #d4edda;
      color: #155724;
    }
    .form-message.error {
      display: block;
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body>
  <nav class="top-nav">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span data-i18n="nav_brand">Разом KW</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="nav-link">Головна</a>
      <a href="catalog.html" class="nav-link" data-i18n="nav_catalog">Каталог</a>
      <a href="school.html" class="nav-link" data-i18n="nav_school">Школа</a>
      <a href="apply.html" class="nav-cta" data-i18n="cat_add_btn">Додати</a>
    </div>
  </nav>

  <header class="site-header">
    <h1 data-i18n="apply_title">Подати заявку в Каталог</h1>
    <p class="site-subtitle" data-i18n="apply_desc">
      Заповніть форму нижче, щоб додати свої послуги до каталогу громади Kitchener-Waterloo.
    </p>
  </header>

  <main>
    <div class="form-container">
      <form id="apply-form">
        <div class="form-group">
          <label for="f-email" data-i18n="apply_email">Ваш Email (не публікується, потрібен для зв'язку) *</label>
          <input type="email" id="f-email" required maxlength="100" />
        </div>
        <div class="form-group">
          <label for="f-name" data-i18n="apply_name">Ім'я спеціаліста або назва компанії *</label>
          <input type="text" id="f-name" required minlength="2" maxlength="100" />
        </div>
        <div class="form-group">
          <label for="f-category" data-i18n="apply_cat">Головна категорія *</label>
          <select id="f-category" required>
            <option value="" data-i18n="apply_cat_opt_default">Оберіть категорию...</option>
            <option value="Beauty" data-i18n="apply_cat_opt_beauty">Beauty (Краса)</option>
            <option value="Health" data-i18n="apply_cat_opt_health">Здоров'я та Медицина</option>
            <option value="Education" data-i18n="apply_cat_opt_edu">Освіта / Дитсадки / Гуртки</option>
            <option value="Services" data-i18n="apply_cat_opt_serv">Побутові та інші послуги</option>
            <option value="Auto" data-i18n="apply_cat_opt_auto">Авто послуги</option>
            <option value="Legal" data-i18n="apply_cat_opt_legal">Юридичні послуги</option>
            <option value="Real Estate" data-i18n="apply_cat_opt_real_estate">Нерухомість</option>
            <option value="Food" data-i18n="apply_cat_opt_food">Їжа та Кондитери</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-subcategory" data-i18n="apply_subcat">Підкатегорія (наприклад: Перукар, Юрист) *</label>
          <input type="text" id="f-subcategory" required minlength="2" maxlength="50" />
        </div>
        <div class="form-group">
          <label for="f-description" data-i18n="apply_desc_short">Короткий опис послуг *</label>
          <input type="text" id="f-description" required minlength="5" maxlength="200" />
        </div>
        <div class="form-group">
          <label for="f-locationType" data-i18n="apply_loc">Місто (Kitchener, Waterloo, Cambridge, Guelph тощо) *</label>
          <select id="f-locationType" required>
            <option value="">Оберіть місто...</option>
            <option value="Kitchener">Kitchener</option>
            <option value="Waterloo">Waterloo</option>
            <option value="Cambridge">Cambridge</option>
            <option value="Guelph">Guelph</option>
            <option value="Breslau">Breslau</option>
            <option value="Elmira">Elmira</option>
            <option value="Ayr">Ayr</option>
            <option value="Online">Online / Віддалено</option>
            <option value="Інше">Інше (вкажіть в адресі)</option>
          </select>
        </div>
        <div class="form-group">
          <label for="f-address" data-i18n="apply_address">Точна адреса (якщо є)</label>
          <input type="text" id="f-address" maxlength="150" />
        </div>
        <div class="form-group">
          <label for="f-phone" data-i18n="apply_phone">Телефон</label>
          <input type="tel" id="f-phone" maxlength="20" pattern="^[\d\s\+\-\(\)]+$" title="Тільки цифри, пробіли та символи + - ( )" />
        </div>
        <div class="form-group">
          <label for="f-telegram" data-i18n="apply_telegram">Telegram (лінк або нікнейм)</label>
          <input type="text" id="f-telegram" maxlength="100" pattern="^(@|https?:\/\/t\.me\/)?[a-zA-Z0-9_]{5,}$" title="Повинен бути нікнейм (може починатися з @) або посилання t.me" />
        </div>
        <div class="form-group">
          <label for="f-instagram" data-i18n="apply_instagram">Instagram (лінк)</label>
          <input type="url" id="f-instagram" maxlength="200" />
        </div>
        <div class="form-group">
          <label for="f-facebook" data-i18n="apply_facebook">Facebook (лінк)</label>
          <input type="url" id="f-facebook" maxlength="200" />
        </div>
        <div class="form-group">
          <label for="f-website" data-i18n="apply_web">Вебсайт (лінк)</label>
          <input type="url" id="f-website" maxlength="200" />
        </div>
        <div class="form-group">
          <label for="f-price" data-i18n="apply_price">Орієнтовна ціна</label>
          <input type="text" id="f-price" maxlength="50" pattern="^[^a-zA-Zа-яА-Я]*$" title="Літери не допускаються. Використовуйте цифри, пробіли, або символи валют ($)" />
        </div>
        <div class="form-group">
          <label for="f-notes" data-i18n="apply_notes">Додаткові нотатки / Опис</label>
          <textarea id="f-notes" maxlength="1000"></textarea>
        </div>
        <button type="submit" id="submit-btn" class="btn-submit" data-i18n="apply_submit">Відправити заявку</button>
        <div id="form-message" class="form-message"></div>
      </form>
    </div>
  </main>

  <footer class="site-footer">
    <p>
      Дані каталогу оновлюються через громадську модерацію.
    </p>
  </footer>

  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script type="module" src="js/apply.js"></script>
<script src="js/i18n.js?v=2"></script>
</body>
</html>
