<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Logos</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; text-align: center; padding: 2rem; }
        h1 { color: #333; }
        .gallery { display: flex; flex-direction: column; align-items: center; gap: 2rem; margin-top: 2rem; }
        .card { background: white; padding: 1rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        img { max-width: 100%; border-radius: 5px; }
        p { font-size: 1.2rem; color: #555; }
    </style>
</head>
<body>
    <h1>Нові концепції логотипу (DALL-E)</h1>
    <p>Мікс Тризуба та Кленового листа. Без старих глюків.</p>
    <div class="gallery">
        <div class="card">
            <h2>Варіант 1</h2>
            <img src="/assets/logo-v4.jpg" alt="Logo V4">
        </div>
        <div class="card">
            <h2>Варіант 2 (Преміум)</h2>
            <img src="/assets/logo-v5.jpg" alt="Logo V5">
        </div>
    </div>
</body>
</html>
